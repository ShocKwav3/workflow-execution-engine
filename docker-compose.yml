services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    build:
      context: ./packages/core/db
      dockerfile: Dockerfile.liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/core/db/changelog:/liquibase/changelog
    command:
      - update
      - --changelog-file=db.changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${PGDATABASE}
      - --username=${PGUSER}
      - --password=${PGPASSWORD}

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-dev
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/core:/app/packages/core
      - /app/packages/core/dist
      - /app/apps/api/dist
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_PRETTY: "true"
    ports:
      - "${PORT}:${PORT}"

  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile
      target: outbox-publisher-dev
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./apps/outboxPublisher:/app/apps/outboxPublisher
      - ./packages/core:/app/packages/core
      - /app/packages/core/dist
      - /app/apps/outboxPublisher/dist
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      OUTBOX_STALE_CLAIM_SECONDS: ${OUTBOX_STALE_CLAIM_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_PRETTY: "true"

volumes:
  postgres_data:
  rabbitmq_data:
