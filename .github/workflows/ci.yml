name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm generate:openapi

      - run: pnpm lint:spec

  ci-passed:
    # always() so the gate fails instead of being skipped when a needed job fails
    if: always()
    needs: [build-test-lint]
    runs-on: ubuntu-latest

    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_passed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$not_passed" ]; then
            echo "$not_passed"
            exit 1
          fi
          echo "All needed jobs succeeded."
