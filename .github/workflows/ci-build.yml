name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/*/dist
            apps/*/dist
          if-no-files-found: error
          retention-days: 1
