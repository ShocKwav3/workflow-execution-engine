name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Node.js, pnpm and the dependencies
        uses: ./.github/actions/setup

      - name: Compile the packages and apps
        run: pnpm build

      - name: Upload the build output for later jobs
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/*/dist
            apps/*/dist
          if-no-files-found: error
          retention-days: 1
