name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Node.js, pnpm and the dependencies
        uses: ./.github/actions/setup

      - name: Lint the code
        run: pnpm lint
