name: Config scan

on:
  workflow_call:

jobs:
  config-scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Scan the Dockerfiles
        uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12.3136.0
        with:
          directory: docker
          framework: dockerfile
          output_format: cli
          quiet: true
          compact: true

      - name: Scan the GitHub Actions workflows
        # Run even if the Dockerfile scan failed, so one run shows every finding
        if: ${{ !cancelled() }}
        uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12.3136.0
        with:
          directory: .github
          framework: github_actions
          output_format: cli
          quiet: true
          compact: true
