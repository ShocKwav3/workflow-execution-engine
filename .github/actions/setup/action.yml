name: Set up the workspace
description: Install pnpm and Node.js, then install the dependencies from the lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
