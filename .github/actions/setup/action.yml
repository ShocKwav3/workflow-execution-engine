name: Set up the workspace
description: Install pnpm and Node.js, then install the dependencies from the lockfile.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js and restore the pnpm cache
      uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: pnpm

    - name: Install the dependencies from the lockfile
      run: pnpm install --frozen-lockfile
      shell: bash
