# Reachable only on the Compose network and the host's loopback port mapping; no password.
bind 0.0.0.0 -::*
protected-mode no
port 6379

# Queued jobs must survive a restart.
dir /data
appendonly yes
appendfsync everysec

# BullMQ breaks if Redis evicts its keys; writes fail instead once the limit is hit.
maxmemory 256mb
maxmemory-policy noeviction
