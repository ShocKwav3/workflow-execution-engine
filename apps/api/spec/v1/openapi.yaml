  /api/v1/workflows/{workflowId}/executions:
    post:
      operationId: createWorkflowExecution
      summary: Start a workflow execution
      tags:
        - WorkflowExecutions
      description: Starts one execution of a published workflow version and returns
        immediately with an execution ID — the run itself happens
        asynchronously. Supports the Idempotency-Key header to avoid creating
        duplicate executions on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowVersionId:
                  type: string
                  maxLength: 36
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
