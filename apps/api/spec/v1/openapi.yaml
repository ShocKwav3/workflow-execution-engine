  /api/v1/workflows/{workflowId}/versions:
    post:
      summary: Create a draft workflow version
      tags:
        - WorkflowVersions
      description: Creates a new draft version for the workflow. Nodes can be added,
        edited, reordered, and removed while it remains a draft. A workflow can
        have at most one draft at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                  description: Version number to create.
              required:
                - version
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
